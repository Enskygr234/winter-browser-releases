name: Winterdeveloper indirmelerini kopyala
on:
  workflow_dispatch:
  push:
    paths: [".github/tasima/liste.tsv"]
permissions:
  contents: write
jobs:
  kopyala:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Eksik dosyalari indir ve yayinla
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          while IFS=$'\t' read -r tag title url; do
            [ -z "$tag" ] && continue
            name=$(basename "$url")
            if gh release view "$tag" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$name"; then
              echo "zaten var: $tag/$name"; continue
            fi
            mkdir -p "d/$tag"; curl -fsSL --retry 3 -o "d/$tag/$name" "$url"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" "d/$tag/$name" --clobber
            else
              gh release create "$tag" "d/$tag/$name" --title "$title" --notes "Winterdeveloper indirme dosyası." --latest=false
            fi
            echo "kopyalandi: $tag/$name"
          done < .github/tasima/liste.tsv
